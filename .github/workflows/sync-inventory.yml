# Daily Inventory Sync
# Runs every day at 6 AM UTC to update inventory quantities
# This is a quick sync (~5-10 minutes) that only updates qty/availability

name: Daily Inventory Sync

on:
  schedule:
    # Run at 6 AM UTC (1 AM EST, 10 PM PST)
    - cron: '0 6 * * *'
  workflow_dispatch:
    # Allow manual trigger

jobs:
  sync-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # Allow up to 30 minutes
    
    steps:
      - name: Trigger Inventory Sync
        run: |
          echo "Starting inventory sync..."
          
          response=$(curl -s -w "\n%{http_code}" -X POST \
            "${{ secrets.SITE_URL }}/api/sync?type=inventory" \
            -H "Content-Type: application/json" \
            -H "x-api-key: ${{ secrets.SYNC_API_KEY }}")
          
          # Extract status code from last line
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          
          echo "Response: $body"
          echo "HTTP Status: $http_code"
          
          if [ "$http_code" -ne 200 ] && [ "$http_code" -ne 207 ]; then
            echo "Sync failed with status $http_code"
            exit 1
          fi
          
          echo "Inventory sync completed successfully!"
      
      - name: Notify on Failure
        if: failure()
        run: |
          echo "Inventory sync failed! Check the logs for details."
          # Add notification (Slack, email, etc.) here if needed

# Required Secrets:
# - SITE_URL: Your production URL (e.g., https://garmentdecor.com)
# - SYNC_API_KEY: The API key for authentication (same as SYNC_API_KEY in .env)
